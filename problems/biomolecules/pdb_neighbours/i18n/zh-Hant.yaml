title: 讀取 PDB 檔，找出殘基的鄰居
summary: >
  PDB 檔把蛋白質的原子一行一行列出，每個原子在固定的欄位寫著它的 $x, y, z$ 位置（單位是埃，Å）。讀入植物小蛋白 crambin
  （PDB 編號 1CRN，46 個殘基）的原子，再找出哪些殘基碰到指定的殘基：也就是有任何原子落在它任何原子的截止距離（4 Å）以內。
  化學家就是這樣找出結合藥物周圍的口袋，或半胱胺酸的配對夥伴。
mirror:
  - 只有 ATOM 與 HETATM 開頭的行才是原子；每個欄位都在固定的欄（PDB 格式的規定）。
  - 鏈、殘基編號與名稱、原子名稱，接著是三個座標。
  - 一次算出這個殘基的原子到所有原子的距離，排成一張表（廣播）。
  - 只要某個殘基有任何原子離我們的任何原子夠近，它就是鄰居。
