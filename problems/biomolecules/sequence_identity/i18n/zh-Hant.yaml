title: 序列相同度與比對
summary: >
  要比較兩個蛋白質，先把它們的序列排齊：其中一條有、另一條沒有的字母，用空位（`-`）補上，再數有幾欄相同。
  相同度百分比是 $100 \times$ 相同的欄數 / 兩條序列都有殘基的欄數。接著自己找出最好的排法：Needleman–Wunsch 演算法填寫一張表 $F$，
  其中 $F_{i,j} = \max(F_{i-1,j-1} + s(a_i, b_j),\ F_{i-1,j} + g,\ F_{i,j-1} + g)$，右下角那一格就是最佳全域比對的分數。
mirror:
  - 只有兩條序列都有殘基的欄，才談得上相同或不同。
  - 相同度就是這些欄中字母相同的比例。
  - 第一列與第一行，代表把一段前綴對上一整排空位。
  - 每一格取三種走法中最好的：把兩個字母配對，或在其中一條序列放一個空位。
