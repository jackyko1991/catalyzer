title: 從 DNA 到蛋白質
summary: >
  DNA 的兩股之間 A 與 T 配對、G 與 C 配對，所以一股反過來讀，就決定了另一股：它的反向互補序列。基因每次讀三個字母（一個密碼子），
  每個密碼子代表一個胺基酸，直到終止密碼子結束這條蛋白質。`ATGGCCTAA` 讀成 ATG GCC TAA：甲硫胺酸、丙胺酸、終止，
  所以蛋白質是 `MA`。純 Python；你的答案必須和 Biopython 一致。
mirror:
  - 把每個鹼基換成它的配對鹼基，再從另一端讀這一股。
  - 只允許 DNA 的四個字母。
  - 從頭開始每次讀三個字母；遇到第一個終止密碼子（*）或剩下不到三個字母時停止。
