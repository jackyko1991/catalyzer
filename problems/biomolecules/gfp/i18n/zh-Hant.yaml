title: GFP：細胞自己造的一盞燈
summary: >
  綠色螢光蛋白會自己製造發色團：它用自己的三個殘基接成一組會發光的稠環。所以只要給細胞 GFP 基因，不必再加任何東西，
  細胞就會發亮。這個發色團之所以有效，是因為蛋白質把它包在一個十一股的桶狀結構裡：被固定住之後，它把能量以光的形式放出，
  而不是靠晃動散掉。在結構中找出發色團、數出圍繞它的股數，並列出接觸它的殘基——其中 Arg96、His148、Thr203 與 Glu222
  正是調整顏色的那幾個。
mirror:
  - 由蛋白質自身殘基形成的發色團，會被記錄成一個修飾殘基；MODRES 行寫出它的名稱，以及它由哪些殘基形成。硒甲硫胺酸只是解結構用的標記手法，不是發色團。
  - 每一行 SHEET 代表一股，並標明它屬於哪一個摺板；桶狀結構就是最大的那個摺板。
  - 只要某個殘基有任何原子落在發色團任一原子的截止距離內，就算接觸到它（水不算）。
