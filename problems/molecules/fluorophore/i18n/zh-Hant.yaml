title: 設計染料：顏色來自鏈的長度
summary: >
  顯微鏡染劑是一種會吸收某個顏色、常常再放出另一個顏色的分子。在**菁染料**（Cy3、Cy5 及其同類）中，顏色只取決於一件事：
  連接兩個氮原子的碳鏈。把鏈上的電子看成長度為 $L$ 的盒中粒子，吸收峰就跟著出來：
  $\lambda = 8mcL^2 / \left(h(N+1)\right)$，其中 $P$ 個碳對應 $N = P+3$ 個電子。用 RDKit 數出鏈長、預測顏色，
  再和十一個實測染料比較：每多一個 `-CH=CH-`，吸收就往紅移約 100 nm——Cy3 正是這樣變成 Cy5 的。
mirror:
  - 共軛鏈從一個氮連到另一個氮；走過整個分子，保留兩者之間最短的路徑。
  - P 是兩個氮之間（不含氮本身）的碳原子數。
  - 盒子裡每個鏈碳貢獻一個電子，兩個氮再貢獻三個；盒子兩端各比鏈多一個鍵長。
  - 套用庫恩的公式；算出來的單位是公尺，要換成奈米。
notes: >
  這個模型比看起來更粗糙，而這正是重點。取 α = 0 時，它幾乎完美吻合喹啉 4,4′ 系列，卻比其他系列短了 100–200 nm：
  鏈兩端的環讓電子能比鏈本身延伸得更遠，而 α 就是這個端點效應的擬合大小。同一個盒子模型用在單純的多烯
  （例如 β-胡蘿蔔素）上會嚴重失準，因為它們的鍵長長短交替，而平底的盒子忽略了這一點。


  **真實的染料設計現在怎麼做。** 在這個一維草圖之上還有三層。第一層是量子化學：含時密度泛函理論（TD-DFT）
  計算基態與激發態之間的能隙，並由此得到吸收峰**與**發射峰、斯托克斯位移，以及振子強度（染料吸光的強弱）。
  它準到可以用來設計，但慢到無法海選十萬個候選分子。第二層決定一支染料在顯微鏡下好不好用：亮度與光穩定性。
  吸光之後會扭轉的分子（扭轉分子內電荷轉移，TICT）會把能量變成熱，而不是光。Janelia Fluor 系列染料正是從這個
  推理來的：把羅丹明的二甲胺基換成四元的氮雜環丁烷環，鎖死扭轉路徑，亮度與光穩定性因此大幅提升
  （Grimm 等，《Nature Methods》12, 244 (2015)；14, 987 (2017)）。第三層是用機器學習代替 TD-DFT：
  用數萬筆實測的「染料＋溶劑」資料訓練的圖神經網路，能在毫秒內預測吸收、發射與量子產率，
  讓緩慢的計算只花在存活下來的候選分子上（Joung 等，《J. Chem. Inf. Model.》61, 1053 (2021)）。
  真實的專案會同時最佳化好幾件事：波長、量子產率、染料能否穿過細胞膜，以及合成有多困難。
