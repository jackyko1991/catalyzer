title: 設計染料：顏色來自鏈的長度
summary: >
  顯微鏡染劑是一種會吸收某個顏色、常常再放出另一個顏色的分子。在**菁染料**（Cy3、Cy5 及其同類）中，顏色只取決於一件事：
  連接兩個氮原子的碳鏈。把鏈上的電子看成長度為 $L$ 的盒中粒子，吸收峰就跟著出來：
  $\lambda = 8mcL^2 / \left(h(N+1)\right)$，其中 $P$ 個碳對應 $N = P+3$ 個電子。用 RDKit 數出鏈長、預測顏色，
  再和十一個實測染料比較：每多一個 `-CH=CH-`，吸收就往紅移約 100 nm——Cy3 正是這樣變成 Cy5 的。
mirror:
  - 共軛鏈從一個氮連到另一個氮；走過整個分子，保留兩者之間最短的路徑。
  - P 是兩個氮之間（不含氮本身）的碳原子數。
  - 盒子裡每個鏈碳貢獻一個電子，兩個氮再貢獻三個；盒子兩端各比鏈多一個鍵長。
  - 套用庫恩的公式；算出來的單位是公尺，要換成奈米。
notes: >
  這個模型比看起來更粗糙，而這正是重點。取 α = 0 時，它幾乎完美吻合喹啉 4,4′ 系列，卻比其他系列短了 100–200 nm：
  鏈兩端的環讓電子能比鏈本身延伸得更遠，而 α 就是這個端點效應的擬合大小。同一個盒子模型用在單純的多烯
  （例如 β-胡蘿蔔素）上會嚴重失準，因為它們的鍵長長短交替，而平底的盒子忽略了這一點。真實的染料設計還要顧及亮度、
  光穩定性，以及染料會不會留在細胞該在的位置；吸收只是其中第一件事。
