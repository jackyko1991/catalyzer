title: 分子指紋與 Tanimoto 相似度
summary: >
  分子指紋把分子變成一組數字：分子中每一種小範圍的原子鄰近環境對應一個數字（RDKit 的 Morgan 指紋，也就是歷史頁上的 ECFP）。
  兩組數字重疊越多，兩個分子就越相似：Tanimoto 相似度是 $|A \cap B| \,/\, |A \cup B|$，從 0（沒有共同之處）到 1（完全相同）。
  自己寫出它，再從一個小分子庫中找出和查詢分子最相似的那一個。
mirror:
  - 半徑 2 的 Morgan 產生器會看每個原子兩個鍵以內的鄰近環境，再折疊進 n_bits 個位置。
  - 指紋就是被設為 1 的位置所成的集合。
  - 共同的位置數除以至少一方有的位置數；兩個空集合沒有任何共同之處。
  - 把查詢分子和分子庫中每一個分子比較，留下最接近的那個。
