<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Two fingerprints as overlapping sets; Tanimoto similarity is the shared part divided by the whole</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>Tanimoto: shared bits ÷ bits in either</text><circle cx='190' cy='145' r='78' fill='rgba(4,120,87,0.15)' stroke='#c2410c' stroke-width='2'/><circle cx='290' cy='145' r='78' fill='rgba(37,99,235,0.15)' stroke='#2563eb' stroke-width='2'/><text x='150' y='150' font-size='12.5' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>A only</text><text x='330' y='150' font-size='12.5' fill='#1d4ed8' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>B only</text><text x='240' y='140' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>A ∩ B</text><text x='240' y='158' font-size='11.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>shared</text><text x='150' y='60' font-size='12' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>caffeine's bits</text><text x='330' y='60' font-size='12' fill='#1d4ed8' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>theophylline's bits</text><rect x='120' y='236' width='240' height='30' rx='10' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><text x='240' y='256' font-size='13' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>T = |A ∩ B| / |A ∪ B|</text></svg>