<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Water drawn with the average mass of each atom, adding up to 18.015 grams per mole</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>Add the masses: water, H₂O</text><line x1='240' y1='130' x2='180' y2='175' stroke='#374151' stroke-width='3' stroke-linecap='round'/><line x1='240' y1='130' x2='300' y2='175' stroke='#374151' stroke-width='3' stroke-linecap='round'/><circle cx='240' cy='130' r='15' fill='#fee2e2' stroke='#b91c1c' stroke-width='2'/><text x='240' y='135' font-size='14' fill='#b91c1c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>O</text><circle cx='180' cy='175' r='15' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='180' y='180' font-size='14' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>H</text><circle cx='300' cy='175' r='15' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='300' y='180' font-size='14' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>H</text><text x='240' y='102' font-size='13' fill='#b91c1c' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='normal'>15.999</text><text x='150' y='205' font-size='13' fill='#6b7280' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='normal'>1.008</text><text x='330' y='205' font-size='13' fill='#6b7280' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='normal'>1.008</text><rect x='110' y='222' width='260' height='34' rx='10' fill='#d1fae5' stroke='#047857' stroke-width='1.5'/><text x='240' y='245' font-size='13' fill='#047857' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>1.008 + 15.999 + 1.008 = 18.015 g/mol</text><text x='240' y='278' font-size='12.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>average atomic masses from the periodic table</text></svg>