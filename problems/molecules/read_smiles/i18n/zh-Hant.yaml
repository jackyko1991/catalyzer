title: 讀懂一個 SMILES 字串
summary: >
  SMILES 字串是寫成一行文字的分子：`CCO` 是乙醇。用 RDKit 把它變成分子，數出每種元素的原子數（包括氫），
  就得到分子式：乙醇是 $\mathrm{C_2H_6O}$。SMILES 大多不寫出氫原子；RDKit 會依每個原子通常形成的鍵數推算出來，
  而你也必須把它們算進去。
mirror:
  - 把字串讀成分子。字串不是有效的 SMILES 時，RDKit 會傳回 None；這時要明確說出來。
  - 逐一走過字串中寫出來的原子（「重原子」），數每種元素各有幾個。
  - 每個原子還帶著 SMILES 省略的氫原子；把它們加進氫的數目。
notes: >
  寫在方括號裡的氫，例如 `[NH4+]`，也用同樣的方法計算：`GetTotalNumHs` 會把它們算進去。
