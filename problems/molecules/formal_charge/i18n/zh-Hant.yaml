title: 形式電荷
summary: >
  在路易斯結構中，一個原子「擁有」它的孤對電子，以及鍵結電子的一半。它的形式電荷是它帶來的價電子數減去它擁有的電子數：
  $\mathrm{FC} = V - L - \tfrac12 B$。在銨離子 $\mathrm{NH_4^+}$ 中，氮沒有孤對電子、有四個鍵（8 個鍵結電子），
  所以 $\mathrm{FC} = 5 - 0 - 4 = +1$。純 Python，不用任何函式庫：只是記帳。
mirror:
  - 一個鍵容納兩個共用的電子，所以鍵結電子數一定是偶數。
  - 帶來的價電子數，減去孤對電子數，再減去鍵結電子數的一半。
  - 整個分子的電荷，是所有原子形式電荷的總和。
