title: 利平斯基五規則
summary: >
  利平斯基發現：當一個口服的分子超出下列四項上限中的兩項以上時，吸收不良的可能性較高：分子量超過 500、
  logP（它比較偏好油還是水）超過 5、氫鍵供體超過 5 個、氫鍵受體超過 10 個。用 RDKit 的描述子算出這四個數字，
  列出分子超出的上限，並判斷它是否通過（最多超出一項）。
mirror:
  - 四個數字描述這個分子；RDKit 會算出每一個。
  - 數字嚴格大於上限才算超出；依 MW、logP、HBD、HBA 的順序列出。
  - 規則容許超出一項；超出兩項以上，就預示吸收不良。
notes: >
  這是 1997 年針對口服藥物的經驗法則，不是定律：許多抗生素與天然產物違反它卻仍然有效，因為它們靠轉運蛋白進入細胞。
