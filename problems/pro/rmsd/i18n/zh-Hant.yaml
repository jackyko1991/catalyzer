title: 模型對嗎？與實驗結構比較 RMSD
summary: >
  要檢查預測的結構，就把它疊到實驗結構上，量出對應原子相距多遠。均方根偏差是
  $\mathrm{RMSD} = \sqrt{\tfrac1N\sum_i \lVert p_i - q_i\rVert^2}$，要先做最佳的旋轉與平移；Kabsch 演算法用一次奇異值分解就能找到它。
  用 numpy 寫出來，再把 AlphaFold 的 crambin 模型和晶體結構 1CRN 逐個 α 碳比較。
mirror:
  - 把兩組點各自移到中心位於原點；這樣就消去了平移。
  - 最佳旋轉來自 3 × 3 共變異矩陣的 SVD；符號修正確保它是旋轉，而不是鏡像。
  - 把 P 轉到 Q 上，再取平均平方距離的平方根。
  - 依殘基編號配對兩個檔案的 α 碳，只比較兩邊都有的殘基。
notes: >
  對 crambin 而言，兩者的差距遠小於 1 Å。晶體 1CRN 在第 25 位是異白胺酸，而 UniProt（以及模型）是白胺酸：
  種子中的 crambin 本來就是兩種形式的天然混合物。依殘基編號配對仍然可行，因為主鏈是一樣的。RMSD 受最不吻合的部分主導；
  對大型蛋白質，CASP 改用 GDT 與 lDDT，看結構中有多少比例足夠接近。
