title: 設計受體：要多緊才夠緊？
summary: >
  T 細胞判斷要殺死什麼，看的是受體**停留**在目標上多久，而不是多常碰到目標。這由兩個數字決定：$k_{on}$（結合得多快）
  與 $k_{off}$（放開得多快）；其中 $K_D = k_{off}/k_{on}$，停留時間 $t_{1/2} = \ln 2 / k_{off}$。
  設計 TCR-T 與 CAR-T 細胞的人，調的正是這兩個數字。對八個針對同一個癌症標靶、已發表的受體算出這些量，
  再餵進動力學校對模型，然後面對一個難題：模型說越緊越好，實驗卻說最會殺的那一個落在中間。
mirror:
  - 停留時間就是半衰期，所以放開的速率是 ln 2 除以它。
  - 親和力是兩個速率的比值，所以由 $k_{off}$ 就能得到 $k_{on}$。K_D 以微莫耳給出，而速率以每莫耳計算。
  - 動力學校對：受體必須撐過 N 個慢步驟才會發出訊號，而每一步它都可能放開。
notes: >
  校對模型的價值在於解釋辨識力：放開慢十倍的受體，訊號會強上不只十倍，因為它必須連續撐過好幾步。
  但它解釋不了上限。同一組受體實際測到的殺傷力，在這道階梯的中段達到最高（DMβ 與 TMβ 變體，約 1–2 µM），
  到最緊的那一個反而下降：一個會抓住目標九分鐘的受體，連目標細胞自身無害的胜肽也會觸發它，於是 T 細胞把自己關掉。
  親和力工程也曾因類似的原因致命：一個針對 MAGE-A3 的增強型受體，同時認得心肌中肌聯蛋白（titin）的一段胜肽，
  導致兩名病人死亡（Linette 等，Blood 122, 863 (2013)；Cameron 等，Sci. Transl. Med. 5, 197ra103 (2013)）。
  CAR-T 所用的結合域（例如針對 CD19 的 FMC63）面臨同樣的取捨；那組結構就在資料庫中。
