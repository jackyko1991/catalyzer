title: 讀懂 AlphaFold 模型的信心分數（pLDDT）
summary: >
  AlphaFold DB 的模型看起來和實驗的 PDB 檔一樣，但平常放 B 因子的那一欄，放的是模型的信心分數：pLDDT，從 0 到 100，
  每個殘基一個值。用 UniProt 編號組出模型的下載網址，讀出 crambin 模型每個殘基的 pLDDT，再把殘基分進 AlphaFold 的四個等級：
  非常高（> 90）、有信心（> 70）、低（> 50）與非常低。
mirror:
  - 每個 AlphaFold DB 模型檔的網址格式都一樣：編號、片段 F1、模型版本。
  - 同一個殘基的每個原子都帶著相同的 pLDDT，所以每個殘基只要從 α 碳（CA）讀一次。
  - 把每個值放進它所超過的第一個下限所對應的等級。
notes: >
  pLDDT 說的是模型對每個殘基局部環境有多確定，而不是整體摺疊或兩個結構域的相對位置是否正確；後者要看預測對齊誤差（PAE）。
  低於 50 的區域在真實世界中常常是無序的：它們本來就沒有單一的形狀可以預測。
