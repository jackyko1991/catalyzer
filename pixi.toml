[workspace]
name = "catalyzer"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"
# the molecular libraries the problems use
rdkit = ">=2024.9"
biopython = ">=1.84"
numpy = ">=2"
# the local runner
fastapi = ">=0.115"
uvicorn = ">=0.30"
pyyaml = ">=6"
pytest = ">=8"
httpx = ">=0.27"
ruff = ">=0.6"

[tasks]
# the local runner: checks your code against a problem's tests, on your own computer (http://127.0.0.1:8795)
runner = "python -m catalyzer.serve"
# check one file against a problem from the command line: pixi run check molecules/read_smiles my_answer.py
check = "python -m catalyzer.cli"
# Hot-reload development: the runner and Vite together, open http://localhost:5190 (scripts/dev.py)
dev = "python scripts/dev.py"
# the site alone (Vite), or a production build
web = { cmd = "npm run dev", cwd = "frontend" }
web-build = { cmd = "npm install --no-audit --no-fund && npm run build", cwd = "frontend" }
# every reference solution passes its tests, every stub fails them, the static check rejects edited signatures
test = "pytest -q tests"
lint = "ruff check catalyzer tests problems scripts && ruff format --check catalyzer tests problems scripts"
# the problem data the static site reads (frontend/src/generated/problems.json)
export = "python -m catalyzer.export"
