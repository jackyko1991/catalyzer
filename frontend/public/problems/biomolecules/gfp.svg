<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Green fluorescent protein: eleven beta strands forming a barrel around the chromophore it made from three of its own residues</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>A barrel with its own lamp inside</text><path d='M135.0,96.0 L165.0,96.0' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><path d='M176.3,99.3 L201.5,115.5' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><path d='M209.3,124.4 L221.7,151.7' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><path d='M223.4,163.4 L219.1,193.1' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><path d='M214.2,203.8 L194.6,226.5' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><path d='M184.7,232.9 L155.9,241.3' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><path d='M144.1,241.3 L115.3,232.9' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><path d='M105.4,226.5 L85.8,203.8' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><path d='M80.9,193.1 L76.6,163.4' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><path d='M78.3,151.7 L90.7,124.4' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><path d='M98.5,115.5 L123.7,99.3' fill='none' stroke='#2563eb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='72' font-size='12.5' fill='#1d4ed8' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>11 strands</text><path d='M135.0,151.0 L149.7,159.5 L149.7,176.5 L135.0,185.0 L120.3,176.5 L120.3,159.5 Z' fill='none' stroke='#c2410c' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='135' cy='168' r='9.350000000000001' fill='none' stroke='#c2410c' stroke-width='1.6'/><path d='M152,168 L166,168' fill='none' stroke='#c2410c' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M166,155 L184,160 L180,179 L162,179 Z' fill='none' stroke='#c2410c' stroke-width='3'/><text x='150' y='206' font-size='12' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>chromophore</text><text x='150' y='266' font-size='11.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>made from Thr65-Tyr66-Gly67, fused into one</text><text x='300' y='54' font-size='12.5' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>and the residues that tune it</text><circle cx='312' cy='88' r='5' fill='#2563eb' stroke='none' stroke-width='1.5'/><text x='326' y='92' font-size='12.5' fill='#1f2937' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>Arg96</text><circle cx='312' cy='116' r='5' fill='#2563eb' stroke='none' stroke-width='1.5'/><text x='326' y='120' font-size='12.5' fill='#1f2937' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>His148</text><circle cx='312' cy='144' r='5' fill='#2563eb' stroke='none' stroke-width='1.5'/><text x='326' y='148' font-size='12.5' fill='#1f2937' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>Thr203</text><circle cx='312' cy='172' r='5' fill='#2563eb' stroke='none' stroke-width='1.5'/><text x='326' y='176' font-size='12.5' fill='#1f2937' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>Glu222</text><text x='300' y='206' font-size='12.5' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>held rigid, it emits light</text><text x='300' y='224' font-size='12.5' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>instead of shaking</text><text x='300' y='242' font-size='12.5' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>the energy away</text><text x='240' y='284' font-size='12.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>the protein makes its own chromophore: no dye to add</text></svg>