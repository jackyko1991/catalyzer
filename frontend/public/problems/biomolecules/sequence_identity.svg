<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Two aligned sequences, MK-LV over MKALI, with matches marked, beside a Needleman-Wunsch table cell taking the best of three moves</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>Line them up, count the agreements</text><rect x='75' y='78' width='30' height='30' rx='6' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><text x='90' y='99' font-size='15' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>M</text><rect x='75' y='138' width='30' height='30' rx='6' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><text x='90' y='159' font-size='15' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>M</text><text x='90' y='128' font-size='15' fill='#c2410c' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>|</text><rect x='115' y='78' width='30' height='30' rx='6' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><text x='130' y='99' font-size='15' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>K</text><rect x='115' y='138' width='30' height='30' rx='6' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><text x='130' y='159' font-size='15' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>K</text><text x='130' y='128' font-size='15' fill='#c2410c' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>|</text><rect x='155' y='78' width='30' height='30' rx='6' fill='#f3f4f6' stroke='#d1d5db' stroke-width='1.5'/><text x='170' y='