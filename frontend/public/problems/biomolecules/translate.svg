<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>The DNA ATGGCCTAA read as codons ATG, GCC, TAA: methionine, alanine, stop</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>DNA → protein, three letters at a time</text><rect x='70' y='104' width='96' height='34' rx='10' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><text x='118' y='127' font-size='17' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>ATG</text><text x='118' y='88' font-size='14' fill='#9ca3af' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='normal'>TAC</text><line x1='118' y1='144' x2='118' y2='172' stroke='#6b7280' stroke-width='2' stroke-linecap='round'/><path d='M118,172 L114.52027572711016,164.7964231811786 L121.47972427288984,164.7964231811786 Z' fill='#6b7280'/><rect x='88' y='180' width='60' height='34' rx='17' fill='#ffedd5' stroke='none' stroke-width='1.5'/><text x='118' y='202' font-size='13' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>M</text><text x='118' y='232' font-size='12' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>Met</text><rect x='190' y='104' width='96' height='34' rx='10' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><text x='238' y='127' font-size='17' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>GCC</text><text x='238' y='88' font-size='14' fill='#9ca3af' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='normal'>CGG</text><line x1='238' y1='144' x2='238' y2='172' stroke='#6b7280' stroke-width='2' stroke-linecap='round'/><path d='M238,172 L234.52027572711015,164.7964231811786 L241.47972427288985,164.7964231811786 Z' fill='#6b7280'/><rect x='208' y='180' width='60' height='34' rx='17' fill='#ffedd5' stroke='none' stroke-width='1.5'/><text x='238' y='202' font-size='13' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>A</text><text x='238' y='232' font-size='12' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>Ala</text><rect x='310' y='104' width='96' height='34' rx='10' fill='#fee2e2' stroke='#b91c1c' stroke-width='1.5'/><text x='358' y='127' font-size='17' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>TAA</text><text x='358' y='88' font-size='14' fill='#9ca3af' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='normal'>ATT</text><line x1='358' y1='144' x2='358' y2='172' stroke='#6b7280' stroke-width='2' stroke-linecap='round'/><path d='M358,172 L354.5202757271102,164.7964231811786 L361.4797242728898,164.7964231811786 Z' fill='#6b7280'/><rect x='328' y='180' width='60' height='34' rx='17' fill='#fee2e2' stroke='none' stroke-width='1.5'/><text x='358' y='202' font-size='13' fill='#b91c1c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>stop</text><text x='32' y='92' font-size='11' fill='#9ca3af' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>partner</text><text x='240' y='278' font-size='12.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>ATGGCCTAA → "MA"</text></svg>