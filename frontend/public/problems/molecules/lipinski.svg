<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Aspirin's molecular weight 180.2, logP 1.31, 1 hydrogen-bond donor and 3 acceptors, all under Lipinski's limits</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>Aspirin against the rule of five</text><text x='28' y='86' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>molecular weight</text><rect x='170' y='70' width='220' height='22' rx='11' fill='#e5e7eb' stroke='none' stroke-width='1.5'/><rect x='170' y='70' width='63.41632' height='22' rx='11' fill='#c2410c' stroke='none' stroke-width='1.5'/><line x1='346' y1='66' x2='346' y2='96' stroke='#b91c1c' stroke-width='2' stroke-linecap='round'/><text x='178' y='86' font-size='12' fill='#fff' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='600'>180.2</text><text x='400' y='86' font-size='13' fill='#b91c1c' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='600'>≤ 500</text><text x='28' y='134' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>logP</text><rect x='170' y='118' width='220' height='22' rx='11' fill='#e5e7eb' stroke='none' stroke-width='1.5'/><rect x='170' y='118' width='46.112' height='22' rx='11' fill='#c2410c' stroke='none' stroke-width='1.5'/><line x1='346' y1='114' x2='346' y2='144' stroke='#b91c1c' stroke-width='2' stroke-linecap='round'/><text x='178' y='134' font-size='12' fill='#fff' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='600'>1.31</text><text x='400' y='134' font-si