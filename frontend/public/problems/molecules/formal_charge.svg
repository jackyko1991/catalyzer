<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Ammonium NH4+: nitrogen has 5 valence electrons, no lone pairs and 8 bonding electrons, so its formal charge is +1</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>Formal charge: NH₄⁺</text><line x1='140' y1='150' x2='80' y2='150' stroke='#374151' stroke-width='3' stroke-linecap='round'/><circle cx='80' cy='150' r='15' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='80' y='155' font-size='14' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>H</text><line x1='140' y1='150' x2='200' y2='150' stroke='#374151' stroke-width='3' stroke-linecap='round'/><circle cx='200' cy='150' r='15' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='200' y='155' font-size='14' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>H</text><line x1='140' y1='150' x2='140' y2='90' stroke='#374151' stroke-width='3' stroke-linecap='round'/><circle cx='140' cy='90' r='15' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='140' y='95' font-size='14' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>H</text><line x1='140' y1='150' x2='140' y2='210' stroke='#374151' stroke-width='3' stroke-linecap='round'/><circle cx='140' cy='210' r='15' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='140' y='215' font-size='14' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>H</text><circle cx='140' cy='150' r='15' fill='#dbeafe' stroke='#1d4ed8' stroke-width='2'/><text x='140' y='155' font-size='14' fill='#1d4ed8' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>N</text><text x='190' y='92' font-size='22' fill='#b91c1c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>+</text><text x='250' y='100' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>valence electrons V</text><text x='440' y='100' font-size='13' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='end' font-weight='600'>5</text><text x='250' y='128' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>lone-pair electrons L</text><text x='440' y='128' font-size='13' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='end' font-weight='600'>0</text><text x='250' y='156' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>bonding electrons B</text><text x='440' y='156' font-size='13' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='end' font-weight='600'>8</text><line x1='250' y1='176' x2='440' y2='176' stroke='#d1d5db' stroke-width='1.5' stroke-linecap='round'/><text x='250' y='202' font-size='13' fill='#374151' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='normal'>FC = V − L − B/2</text><text x='250' y='228' font-size='13' fill='#c2410c' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='600'>   = 5 − 0 − 4 = +1</text><text x='240' y='278' font-size='12.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>each bond's two electrons are shared: the atom owns half</text></svg>