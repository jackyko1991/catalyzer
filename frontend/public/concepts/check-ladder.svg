<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Four steps of checking an AI result as rising steps: model confidence, physics, agreement with experiment, and a real experiment</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>Checking an AI result: four questions</text><rect x='30' y='190' width='96' height='60' rx='8' fill='#ffedd5' stroke='#c2410c' stroke-width='1.5'/><text x='78' y='212' font-size='15' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>1</text><text x='78' y='164' font-size='11.5' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>Is the</text><text x='78' y='179' font-size='11.5' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>model sure?</text><text x='78' y='232' font-size='11' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>pLDDT, PAE</text><rect x='138' y='156' width='96' height='94' rx='8' fill='#ffedd5' stroke='#c2410c' stroke-width='1.5'/><text x='186' y='178' font-size='15' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>2</text><text x='186' y='130' font-size='11.5' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>Does it</text><text x='186' y='145' font-size='11.5' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>obey physics?</text><t