<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Single, double and triple bonds drawn as one, two and three shared electron pairs: H2 0.74 Å, O2 1.21 Å, N2 1.10 Å</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>A bond is a shared pair of electrons</text><circle cx='110' cy='90' r='15' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='110' y='95' font-size='14' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>H</text><circle cx='210' cy='90' r='15' fill='#fff' stroke='#6b7280' stroke-width='2'/><text x='210' y='95' font-size='14' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>H</text><rect x='144' y='84' width='32' height='12' rx='6' fill='#ffedd5' stroke='#c2410c' stroke-width='1'/><circle cx='153' cy='90' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><circle cx='167' cy='90' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><text x='250' y='88' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>single: 1 shared pair</text><text x='250' y='106' font-size='12' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>H₂ 0.74 Å</text><circle cx='110' cy='160' r='15' fill='#fee2e2' stroke='#b91c1c' stroke-width='2'/><text x='110' y='165' font-size='14' fill='#b91c1c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>O</text><circle cx='210' cy='160' r='15' fill='#fee2e2' stroke='#b91c1c' stroke-width='2'/><tex