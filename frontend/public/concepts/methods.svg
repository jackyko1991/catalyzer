<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>A ladder of methods from Hückel and force fields through Hartree-Fock and DFT to coupled cluster, with what each answers and how large a system it can treat</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>Quantum chemistry: cost against what it answers</text><rect x='24' y='64' width='120' height='26' rx='6' fill='#d1fae5' stroke='none' stroke-width='1.5'/><text x='84' y='82' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>Hückel</text><text x='156' y='82' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>a graph's eigenvalues</text><text x='456' y='82' font-size='11.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='end' font-weight='normal'>atoms: thousands</text><rect x='24' y='98' width='120' height='26' rx='6' fill='#d1fae5' stroke='none' stroke-width='1.5'/><text x='84' y='116' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>Force field</text><text x='156' y='116' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>no electrons at all</text><text x='456' y='116' font-size='11.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='end' font-weight='normal'>atoms: millions</text><rect x='24' y='132' width='120' height='26' rx='6' fill='#dbeafe' stroke='none' stroke-width='1.5'/><text x='84' y='150' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>Hartree-Fock</text><text x='156' y='150' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>electrons, averaged</text><text x='456' y='150' font-size='11.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='end' font-weight='normal'>atoms: hundreds</text><rect x='24' y='166' width='120' height='26' rx='6' fill='#ede9fe' stroke='none' stroke-width='1.5'/><text x='84' y='184' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>DFT</text><text x='156' y='184' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>electrons + correlation</text><text x='456' y='184' font-size='11.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='end' font-weight='normal'>atoms: hundreds</text><rect x='24' y='200' width='120' height='26' rx='6' fill='#fde68a' stroke='none' stroke-width='1.5'/><text x='84' y='218' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>TD-DFT</text><text x='156' y='218' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>excited states: colour</text><text x='456' y='218' font-size='11.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='end' font-weight='normal'>atoms: tens to hundreds</text><rect x='24' y='234' width='120' height='26' rx='6' fill='#fecaca' stroke='none' stroke-width='1.5'/><text x='84' y='252' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>Coupled cluster</text><text x='156' y='252' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>the reference answer</text><text x='456' y='252' font-size='11.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='end' font-weight='normal'>atoms: tens</text><line x1='14' y1='60' x2='14' y2='262' stroke='#9ca3af' stroke-width='2' stroke-linecap='round'/><path d='M14,262 L10.520275727110159,254.7964231811786 L17.479724272889843,254.7964231811786 Z' fill='#9ca3af'/><text x='8' y='160' font-size='10.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>more expensive</text><text x='240' y='282' font-size='12.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>pick the cheapest method that can answer your question</text></svg>