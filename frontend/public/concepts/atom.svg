<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>A carbon atom: a nucleus of 6 protons and 6 neutrons, 2 inner electrons and 4 valence electrons; Lewis dots for hydrogen, carbon, nitrogen and oxygen with their usual numbers of bonds</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>An atom: a nucleus and its electrons</text><circle cx='118' cy='160' r='82' fill='none' stroke='#c2410c' stroke-width='1.5'/><circle cx='118' cy='160' r='44' fill='none' stroke='#9ca3af' stroke-width='1.5'/><circle cx='118' cy='160' r='20' fill='#fee2e2' stroke='#b91c1c' stroke-width='2'/><text x='118' y='158' font-size='11' fill='#b91c1c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>6 p</text><text x='118' y='171' font-size='11' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>6 n</text><circle cx='162' cy='160' r='4' fill='#6b7280' stroke='none' stroke-width='1.5'/><circle cx='74' cy='160' r='4' fill='#6b7280' stroke='none' stroke-width='1.5'/><circle cx='189.96177007501058' cy='199.31289416554466' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><circle cx='76.60261942281167' cy='230.78316806520763' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><circle cx='48.455797399746544' cy='116.55343644550354' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><circle cx='163.45869556669118' cy='91.7540697376401' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><text x='118' y='66' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>carbon</text><circle cx='46' cy='258' r='4' fill='#6b7280' stroke='none' stroke-width='1.5'/><text x='56' y='262' font-size='11.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>2 inner</text><circle cx='118' cy='258' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><text x='128' y='262' font-size='11.5' fill='#c2410c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>4 valence</text><text x='355' y='66' font-size='12' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>valence electrons → usual bonds</text><text x='270' y='126' font-size='22' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>H</text><circle cx='270' cy='99' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><text x='300' y='123' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>1 → 1</text><text x='390' y='126' font-size='22' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>C</text><circle cx='390' cy='99' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><circle cx='409' cy='118' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><circle cx='390' cy='137' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><circle cx='371' cy='118' r='4' fill='#c2410c' stroke='none' stroke-width='1.5'/><text x='420' y='123' font-size='12' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>4 → 4</text><text x='270' y='210' font-size='22' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>N</text><circle cx='265' cy='183' r='4' fi