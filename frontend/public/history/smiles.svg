<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>The SMILES string CCO beside the ethanol molecule it describes, and c1ccccc1 beside benzene</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>SMILES: a molecule written as text</text><rect x='30' y='70' width='120' height='56' rx='10' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><text x='90' y='106' font-size='24' fill='#111827' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>CCO</text><line x1='160' y1='98' x2='220' y2='98' stroke='#6b7280' stroke-width='2' stroke-linecap='round'/><path d='M220,98 L212.7964231811786,101.47972427288984 L212.7964231811786,94.52027572711016 Z' fill='#6b7280'/><line x1='260' y1='98' x2='320' y2='98' stroke='#374151' stroke-width='3' stroke-linecap='round'/><line x1='320' y1='98' x2='380' y2='98' stroke='#374151' stroke-width='3' stroke-linecap='round'/><circle cx='260' cy='98' r='15' fill='#e5e7eb' stroke='#374151' stroke-width='2'/><text x='260' y='103' font-size='14' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>C</text><circle cx='320' cy='98' r='15' fill='#e5e7eb' stroke='#374151' stroke-width='2'/><text x='320' y='103' font-size='14' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>C</text><circle cx='380' cy='98' r='15' fill='#fee2e2' stroke='#b91c1c' stroke-width='2'/><text x='380' y='103' font-size='14' fill='#b91c1c' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='600'>O</text><text x='320' y='140' font-size='13' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>ethanol</text><rect x='30' y='180' width='120' height='56' rx='10' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><text x='90' y='216' font-size='18' fill='#111827' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='middle' font-weight='600'>c1ccccc1</text><line x1='160' y1='208' x2='220' y2='208' stroke='#6b7280' stroke-width='2' stroke-linecap='round'/><path d='M220,208 L212.7964231811786,211.47972427288985 L212.7964231811786,204.52027572711015 Z' fill='#6b7280'/><path d='M320.0,170.0 L352.9,189.0 L352.9,227.0 L320.0,246.0 L287.1,227.0 L287.1,189.0 Z' fill='none' stroke='#374151' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='320' cy='208' r='20.900000000000002' fill='none' stroke='#374151' stroke-width='1.6'/><text x='400' y='212' font-size='13' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>benzene</text><text x='240' y='280' font-size='12' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>lower case = aromatic · digits open and close a ring</text></svg>