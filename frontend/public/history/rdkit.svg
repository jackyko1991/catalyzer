<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Lines of Python with RDKit: read a SMILES string, then count its atoms and compute its weight</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>RDKit: chemistry from Python</text><rect x='24' y='58' width='432' height='156' rx='10' fill='#1f2937' stroke='none' stroke-width='1.5'/><text x='44' y='88' font-size='13' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' xml:space='preserve'><tspan fill='#c084fc'>from</tspan><tspan fill='#e5e7eb'> rdkit </tspan><tspan fill='#c084fc'>import</tspan><tspan fill='#e5e7eb'> Chem</tspan></text><text x='44' y='110' font-size='13' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' xml:space='preserve'><tspan fill='#c084fc'>from</tspan><tspan fill='#e5e7eb'> rdkit.Chem </tspan><tspan fill='#c084fc'>import</tspan><tspan fill='#e5e7eb'> Descriptors</tspan></text><text x='44' y='132' font-size='13' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' xml:space='preserve'></text><text x='44' y='154' font-size='13' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' xml:space='preserve'><tspan fill='#e5e7eb'>mol = Chem.</tspan><tspan fill='#93c5fd'>MolFromSmiles</tspan><tspan fill='#e5e7eb'>(</tspan><tspan fill='#86efac'>"CCO"</tspan><tspan fill='#e5e7eb'>)</tspan></text><text x='44' y='176' font-size='13' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' xml:space='preserve'><tspan fill='#e5e7eb'>mol.</tspan><tspan fill='#93c5fd'>GetNumAtoms</tspan><tspan fill='#e5e7eb'>()</tspan><tspan fill='#9ca3af'>      # 3</tspan></text><text x='44' y='198' font-size='13' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' xml:space='preserve'><tspan fill='#e5e7eb'>Descriptors.</tspan><tspan fill='#93c5fd'>MolWt</tspan><tspan fill='#e5e7eb'>(mol)</tspan><tspan fill='#9ca3af'>  # 46.07</tspan></text><text x='240' y='250' font-size='12.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>open source since 2006 (BSD licence)</text><text x='240' y='272' font-size='12.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>the same code for a student and for a drug company</text></svg>