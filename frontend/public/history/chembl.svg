<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>A table linking molecules to protein targets and measured activities</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>ChEMBL: molecule × target × measured activity</text><rect x='24' y='56' width='432' height='176' rx='10' fill='#fff' stroke='#d1d5db' stroke-width='1.5'/><rect x='24' y='56' width='432' height='32' rx='10' fill='#f3f4f6' stroke='none' stroke-width='1.5'/><text x='40' y='77' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>molecule</text><text x='150' y='77' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>target protein</text><text x='350' y='77' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>activity</text><text x='40' y='114' font-size='12.5' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>aspirin</text><text x='150' y='114' font-size='12.5' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>cyclooxygenase-1</text><text x='350' y='114' font-size='12.5' fill='#c2410c' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='normal'>IC50 (nM)</text><text x='40' y='146' font-size='12.5' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>caffeine</text><text x='150' y='146' font-size='12.5' fill='#11182