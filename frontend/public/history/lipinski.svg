<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' width='480' height='300' role='img'><title>Lipinski's four limits drawn as gauges: molecular weight, logP, hydrogen-bond donors and acceptors</title><rect x='0' y='0' width='480' height='300' rx='14' fill='#f8fafc' stroke='none' stroke-width='1.5'/><text x='24' y='40' font-size='14' fill='#111827' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='600'>Lipinski's rule of five: four limits</text><text x='30' y='89' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>molecular weight</text><rect x='200' y='74' width='200' height='22' rx='11' fill='#e5e7eb' stroke='none' stroke-width='1.5'/><rect x='200' y='74' width='124' height='22' rx='11' fill='#047857' stroke='none' stroke-width='1.5'/><line x1='360' y1='70' x2='360' y2='100' stroke='#b91c1c' stroke-width='2' stroke-linecap='round'/><text x='410' y='90' font-size='13' fill='#b91c1c' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='600'>≤ 500</text><text x='30' y='139' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>logP (oily vs watery)</text><rect x='200' y='124' width='200' height='22' rx='11' fill='#e5e7eb' stroke='none' stroke-width='1.5'/><rect x='200' y='124' width='96' height='22' rx='11' fill='#047857' stroke='none' stroke-width='1.5'/><line x1='360' y1='120' x2='360' y2='150' stroke='#b91c1c' stroke-width='2' stroke-linecap='round'/><text x='410' y='140' font-size='13' fill='#b91c1c' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='600'>≤ 5</text><text x='30' y='189' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>H-bond donors</text><rect x='200' y='174' width='200' height='22' rx='11' fill='#e5e7eb' stroke='none' stroke-width='1.5'/><rect x='200' y='174' width='80' height='22' rx='11' fill='#047857' stroke='none' stroke-width='1.5'/><line x1='360' y1='170' x2='360' y2='200' stroke='#b91c1c' stroke-width='2' stroke-linecap='round'/><text x='410' y='190' font-size='13' fill='#b91c1c' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='600'>≤ 5</text><text x='30' y='239' font-size='13' fill='#374151' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='start' font-weight='normal'>H-bond acceptors</text><rect x='200' y='224' width='200' height='22' rx='11' fill='#e5e7eb' stroke='none' stroke-width='1.5'/><rect x='200' y='224' width='140' height='22' rx='11' fill='#047857' stroke='none' stroke-width='1.5'/><line x1='360' y1='220' x2='360' y2='250' stroke='#b91c1c' stroke-width='2' stroke-linecap='round'/><text x='410' y='240' font-size='13' fill='#b91c1c' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' text-anchor='start' font-weight='600'>≤ 10</text><text x='240' y='284' font-size='12.5' fill='#6b7280' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' font-weight='normal'>break two or more: poor absorption is more likely</text></svg>